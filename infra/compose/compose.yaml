name: ${COMPOSE_PROJECT_NAME:-rivetquay}

x-app: &app
  image: rivetquay-fixture:local
  build:
    context: ../..
    dockerfile: infra/ci.Dockerfile

services:
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    profiles: ['oidc']
    command: ['dex', 'serve', '/etc/dex/rivetquay.yaml']
    ports:
      - '127.0.0.1:${DEX_PORT:-5556}:5556'
    volumes:
      - ${DEX_CONFIG:-./dex.yaml}:/etc/dex/rivetquay.yaml:ro

  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo-local-only
      POSTGRES_DB: demo
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../packages/contracts/fixtures/seed.sql:/docker-entrypoint-initdb.d/10-demo.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U demo -d demo']
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.11
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - '127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
    volumes:
      - maildata:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    <<: *app
    command:
      - sh
      - -ec
      - |
        if [ -z "$$BS_PLATFORM_VAULT_MASTER_KEY" ]; then unset BS_PLATFORM_VAULT_MASTER_KEY; fi
        node infra/migrate.mjs
        chmod +x infra/compose/worker-client.mjs
        exec node apps/api/src/server.ts
    environment:
      API_HOST: 0.0.0.0
      DATABASE_URL: postgres://demo:demo-local-only@postgres:5432/demo
      BS_FIXTURE_LOGIN: '1'
      BS_AUTH_MODE: ${BS_AUTH_MODE:-fixture}
      BS_DEX_ISSUER: ${BS_DEX_ISSUER:-http://localhost:5556/dex}
      BS_DEX_IN_COMPOSE: '1'
      BS_OIDC_REDIRECT_URI: ${BS_OIDC_REDIRECT_URI:-http://localhost:5173/oidc/callback}
      BS_MAILPIT: '1'
      BS_MAILPIT_HOST: mailpit
      BS_WORKER_PYTHON: /repo/infra/compose/worker-client.mjs
      BS_WORKER_SOCKET: /run/fixture-worker/runtime.sock
      BS_PLATFORM_VAULT_MASTER_KEY: ${BS_PLATFORM_VAULT_MASTER_KEY:-}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    volumes:
      - worker-socket:/run/fixture-worker
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) })",
        ]
      interval: 5s
      timeout: 3s
      retries: 15

  web:
    <<: *app
    command:
      [
        'pnpm',
        '--filter',
        '@bs/web',
        'exec',
        'vite',
        '--configLoader',
        'native',
        '--host',
        '0.0.0.0',
        '--strictPort',
      ]
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
      VITE_FIXTURE_LOGIN: '1'
      VITE_BS_AUTH_MODE: ${BS_AUTH_MODE:-fixture}
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:5173'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173/').then(r => { if (!r.ok) process.exit(1) })",
        ]
      interval: 5s
      timeout: 3s
      retries: 15

  worker:
    <<: *app
    command: ['/repo/.venv/bin/python', 'infra/compose/worker_socket.py']
    environment:
      BS_WORKER_SOCKET: /run/fixture-worker/runtime.sock
    volumes:
      - worker-socket:/run/fixture-worker
    healthcheck:
      test: ['CMD-SHELL', 'test -S "$$BS_WORKER_SOCKET"']
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  worker-socket:
  pgdata:
    name: ${POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME:-rivetquay}_pgdata}
  maildata:
    name: ${MAILPIT_VOLUME:-${COMPOSE_PROJECT_NAME:-rivetquay}_maildata}
