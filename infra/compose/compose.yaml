name: ${COMPOSE_PROJECT_NAME:-rivetquay}

services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo-local-only
      POSTGRES_DB: demo
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../packages/contracts/fixtures/seed.sql:/docker-entrypoint-initdb.d/10-demo.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U demo -d demo']
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.11
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - '127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
    volumes:
      - maildata:/data

  api:
    profiles: [placeholders]
    image: node:24.4.1-bookworm-slim
    command:
      [
        'node',
        '-e',
        "require('node:http').createServer((_, res) => res.end('API placeholder')).listen(3000, '0.0.0.0')",
      ]
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: [placeholders]
    image: node:24.4.1-bookworm-slim
    command:
      [
        'node',
        '-e',
        "require('node:http').createServer((_, res) => res.end('Web placeholder')).listen(5173, '0.0.0.0')",
      ]
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:5173'

  worker:
    profiles: [placeholders]
    image: python:3.12.12-slim-bookworm
    command:
      ['python', '-c', "import time; print('Worker placeholder', flush=True); time.sleep(86400)"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    name: ${POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME:-rivetquay}_pgdata}
  maildata:
    name: ${MAILPIT_VOLUME:-${COMPOSE_PROJECT_NAME:-rivetquay}_maildata}
